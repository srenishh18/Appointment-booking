<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | AppointEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">AppointEase</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="providers.html">Providers</a>
        <a href="appointments.html">Appointments</a>
        <a href="profile.html" class="active">Profile</a>
    </div>
</nav>

<main class="profile-page">

    <div class="profile-card">

        <div class="profile-avatar">
            👤
        </div>

        <h1 id="profileName">Guest User</h1>
        <p id="profileEmail">guest@example.com</p>

        <div class="profile-details">

            <div>
                <span>Full Name</span>
                <strong id="nameField">Guest User</strong>
            </div>

            <div>
                <span>Email</span>
                <strong id="emailField">guest@example.com</strong>
            </div>

        </div>

        <button class="btn secondary" onclick="logout()">
            Logout
        </button>

    </div>

</main>

<script src="js/app.js"></script>

</body>
</html>
