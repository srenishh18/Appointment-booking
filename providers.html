<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Providers | AppointEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">AppointEase</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="providers.html" class="active">Providers</a>
        <a href="appointments.html">Appointments</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<main class="page-container">

    <div class="page-header">
        <div>
            <span class="badge">Our Providers</span>
            <h1>Choose a provider</h1>
            <p>Find a professional and book an appointment.</p>
        </div>

        <input
            type="text"
            id="searchProvider"
            class="search-input"
            placeholder="Search provider..."
        >
    </div>

    <div class="provider-grid" id="providerGrid"></div>

</main>

<script src="js/app.js"></script>

<script>

const providers = [
    {
        id: 1,
        name: "Dr. Arun Kumar",
        specialty: "General Physician",
        experience: "8 years",
        rating: "4.8",
        icon: "👨‍⚕️"
    },
    {
        id: 2,
        name: "Dr. Priya Sharma",
        specialty: "Consultant",
        experience: "6 years",
        rating: "4.7",
        icon: "👩‍⚕️"
    },
    {
        id: 3,
        name: "Rahul Menon",
        specialty: "Career Consultant",
        experience: "10 years",
        rating: "4.9",
        icon: "👨‍💼"
    },
    {
        id: 4,
        name: "Ananya Rao",
        specialty: "Student Counselor",
        experience: "5 years",
        rating: "4.6",
        icon: "👩‍💼"
    }
];

const grid = document.getElementById("providerGrid");

function displayProviders(list) {

    grid.innerHTML = "";

    list.forEach(provider => {

        grid.innerHTML += `
            <div class="provider-card">

                <div class="provider-avatar">
                    ${provider.icon}
                </div>

                <h3>${provider.name}</h3>

                <p class="specialty">
                    ${provider.specialty}
                </p>

                <div class="provider-info">
                    <span>⭐ ${provider.rating}</span>
                    <span>${provider.experience}</span>
                </div>

                <a
                    href="book-appointment.html?provider=${provider.id}"
                    class="btn primary full"
                >
                    Book Appointment
                </a>

            </div>
        `;
    });
}

displayProviders(providers);

document
    .getElementById("searchProvider")
    .addEventListener("input", function () {

        const search = this.value.toLowerCase();

        const filtered = providers.filter(provider =>
            provider.name.toLowerCase().includes(search) ||
            provider.specialty.toLowerCase().includes(search)
        );

        displayProviders(filtered);
    });

</script>

</body>
</html>
