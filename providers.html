<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Providers | AppointEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">AppointEase</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="providers.html" class="active">Providers</a>
        <a href="appointments.html">Appointments</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<main class="page-container">

    <div class="page-header">
        <div>
            <span class="badge">Our Providers</span>
            <h1>Choose a provider</h1>
            <p>Find a professional and book an appointment.</p>
        </div>

        <input
            type="text"
            id="searchProvider"
            class="search-input"
            placeholder="Search provider..."
        >
    </div>

    <div class="provider-grid" id="providerGrid"></div>

</main>

<script src="js/app.js"></script>

<script>
const grid = document.getElementById("providerGrid");
let systemProviders = getStoredProviders();

function displayProviders(list) {
    grid.innerHTML = "";
    if (list.length === 0) {
        grid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px; background: white; border-radius: 16px; border: 1px solid var(--border);">
                <h3>No providers found</h3>
                <p style="color: var(--muted); margin-top: 8px;">Try searching for a different name or specialty.</p>
            </div>
        `;
        return;
    }

    list.forEach(provider => {
        grid.innerHTML += `
            <div class="provider-card">
                <div class="provider-avatar">
                    ${provider.icon || "👨‍⚕️"}
                </div>
                <h3>${provider.name}</h3>
                <p class="specialty">
                    ${provider.specialty}
                </p>
                <div class="provider-info">
                    <span>⭐ ${provider.rating}</span>
                    <span>${provider.experience}</span>
                </div>
                <a
                    href="book-appointment.html?provider=${provider.id}"
                    class="btn primary full"
                >
                    Book Appointment
                </a>
            </div>
        `;
    });
}

displayProviders(systemProviders);

document.getElementById("searchProvider").addEventListener("input", function () {
    const search = this.value.toLowerCase();
    const filtered = systemProviders.filter(provider =>
        provider.name.toLowerCase().includes(search) ||
        provider.specialty.toLowerCase().includes(search)
    );
    displayProviders(filtered);
});
</script>

</body>
</html>
