<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | AppointEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">AppointEase</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="providers.html">Providers</a>
        <a href="appointments.html">Appointments</a>
        <a href="profile.html">Profile</a>
    </div>
</nav>

<main class="form-page">

    <div class="form-header">
        <span class="badge">New Appointment</span>
        <h1>Book an Appointment</h1>
        <p>Fill in the details below.</p>
    </div>

    <div class="booking-card">

        <form id="bookingForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">

            <div>
                <label>Service Provider</label>
                <select id="provider" required>
                    <option value="">Select Service Provider</option>
                </select>
            </div>

            <div>
                <label>Appointment Date</label>
                <input
                    type="date"
                    id="date"
                    required
                >
            </div>

            <div style="grid-column: span 2;">
                <label>Available Time Slot</label>
                <select id="time" required>
                    <option value="">Select Available Time</option>
                    <option>09:00 AM</option>
                    <option>10:00 AM</option>
                    <option>11:00 AM</option>
                    <option>12:00 PM</option>
                    <option>02:00 PM</option>
                    <option>03:00 PM</option>
                    <option>04:00 PM</option>
                    <option>05:00 PM</option>
                </select>
            </div>

            <div style="grid-column: span 2;">
                <label>Purpose of Appointment</label>
                <textarea
                    id="purpose"
                    rows="4"
                    placeholder="Enter the purpose of appointment"
                    required
                ></textarea>
            </div>

            <div style="grid-column: span 2;">
                <div id="slotConflictWarning" style="display:none; margin-bottom: 20px; padding: 14px 18px; background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 12px; font-size: 14px; color: #b45309; line-height: 1.5;"></div>

                <button class="btn primary full" type="submit">
                    Confirm Appointment →
                </button>
            </div>

        </form>

    </div>

</main>

<div class="modal" id="successModal">

    <div class="modal-card">

        <div class="success-icon">✓</div>

        <h2>Appointment Confirmed!</h2>

        <p id="appointmentDetails"></p>

        <a href="appointments.html" class="btn primary full">
            View Appointments
        </a>

    </div>

</div>

<script src="js/app.js"></script>
<script src="js/booking.js"></script>

</body>
</html>
