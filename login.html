<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AppointEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-brand">
        <a href="index.html" class="logo" style="text-decoration: none; color: white;">
            ⚡ AppointEase
        </a>
        <h1>Welcome Back</h1>
        <p>Access your personalized dashboard, manage schedules, and coordinate appointments effortlessly.</p>
    </div>

    <div class="auth-card">

        <h2>Login to Account</h2>
        <p class="muted">Enter your email and password to access your account</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="e.g. user@example.com"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="btn primary full">
                Login to Dashboard →
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="register.html">Create account</a>
        </p>

        <div style="text-align: center; margin-top: 18px;">
            <a href="index.html" style="color: var(--muted); font-size: 14px; text-decoration: none; font-weight: 500;">← Return to Home Website</a>
        </div>

    </div>

</div>

<script src="js/app.js"></script>
<script src="js/login.js"></script>

</body>
</html>
