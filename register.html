<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AppointEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-brand">
        <a href="index.html" class="logo" style="text-decoration: none; color: white;">
            ⚡ AppointEase
        </a>
        <h1>Create Account</h1>
        <p>Join AppointEase to easily search service providers, schedule appointments, and coordinate your calendar.</p>
    </div>

    <div class="auth-card">

        <h2>Sign Up for AppointEase</h2>
        <p class="muted">Fill in your details below to set up your account</p>

        <form id="registerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="e.g. Alex Johnson"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="e.g. alex@example.com"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter password"
                required
            >

            <button type="submit" class="btn primary full">
                Create Free Account →
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <div style="text-align: center; margin-top: 18px;">
            <a href="index.html" style="color: var(--muted); font-size: 14px; text-decoration: none; font-weight: 500;">← Return to Home Website</a>
        </div>

    </div>

</div>

<script src="js/app.js"></script>
<script src="js/login.js"></script>

</body>
</html>
